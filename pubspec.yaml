name: flutter_gluko_apps
description: "GlukoTrack — pencatat gula darah harian offline-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  # Sumber waktu yang bisa dipatok di test (golden, alur penuh).
  clock: ^1.1.3
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.1
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  meta: ^1.18.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  # Dipakai langsung agar build hook SQLCipher (lihat `hooks.user_defines`
  # di bawah) terikat ke versi yang kita kendalikan, bukan sekadar transitif
  # dari drift.
  sqlite3: ^3.5.2
  timezone: ^0.11.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

# NFR-05: database terenkripsi at-rest.
# `sqlcipher_flutter_libs` sudah EOL (rilis terakhir 0.7.0+eol: "Not used anymore,
# update to version 3.x of package:sqlite3 instead"). Sejak sqlite3 3.x, varian
# SQLCipher dipilih lewat build hook di bawah ini — tidak ada paket libs terpisah.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
