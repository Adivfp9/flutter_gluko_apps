# Rencana 1.4 / 5.5: snapshot skema drift untuk test migrasi (SchemaVerifier).
# Setiap kenaikan `schemaVersion` jalankan:
#   dart run drift_dev make-migrations
# lalu tulis langkah migrasinya dan test yang dihasilkan di test/drift/.
targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            app_database: lib/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
