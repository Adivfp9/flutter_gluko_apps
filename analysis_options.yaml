# GlukoTrack — konfigurasi analyzer.
# NFR-11: lint ketat tanpa warning. Aturan batas antar-layer Clean Architecture
# tidak bisa diekspresikan analyzer, jadi ditegakkan lewat test/architecture_test.dart.
include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Berkas serah-terima desain, bukan source yang dikompilasi.
    # Port-nya ada di lib/core/theme/.
    - docs/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    # Helper SchemaVerifier hasil `drift_dev schema generate`.
    - "test/drift/**/generated/**"
    - "lib/l10n/generated/**"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # PRD 6.1: UI berbahasa Indonesia, string literal di widget masih diizinkan
    # sampai ekstraksi l10n di Sprint 5.6.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
